<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <!-- Deep Sea Background Gradient -->
    <linearGradient id="bg-grad-192" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="35%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Bioluminescent Ambient Radial Glow -->
    <radialGradient id="center-glow-192" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Fish Body Gradient -->
    <linearGradient id="fish-body-192" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="90%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Fish Belly Highlight -->
    <linearGradient id="fish-belly-192" x1="20%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#ecfeff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>

    <!-- Fin Gradient -->
    <linearGradient id="fin-grad-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Bubble Shield Iridescent Ring Gradient -->
    <radialGradient id="shield-grad-192" cx="45%" cy="40%" r="55%">
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="90%" stop-color="#67e8f9" stop-opacity="0.4" />
      <stop offset="96%" stop-color="#e0f2fe" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </radialGradient>

    <!-- Bubble Highlight Gradient -->
    <radialGradient id="bubble-spec-192" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for Soft Glow -->
    <filter id="glow-192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Sea Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bg-grad-192)" />

  <!-- Ambient Water Rays / Sunlight Filter -->
  <polygon points="120,0 180,0 230,512 140,512" fill="#38bdf8" opacity="0.04" />
  <polygon points="260,0 340,0 410,512 300,512" fill="#38bdf8" opacity="0.06" />
  <polygon points="380,0 450,0 512,420 512,180" fill="#67e8f9" opacity="0.03" />

  <!-- Center Ambient Bioluminescent Bloom -->
  <circle cx="256" cy="265" r="230" fill="url(#center-glow-192)" />

  <!-- Background Ambient Bubbles -->
  <circle cx="100" cy="380" r="14" fill="url(#bubble-spec-192)" opacity="0.4" />
  <circle cx="85" cy="180" r="8" fill="url(#bubble-spec-192)" opacity="0.5" />
  <circle cx="420" cy="390" r="16" fill="url(#bubble-spec-192)" opacity="0.4" />
  <circle cx="430" cy="140" r="11" fill="url(#bubble-spec-192)" opacity="0.6" />
  <circle cx="160" cy="110" r="9" fill="url(#bubble-spec-192)" opacity="0.5" />
  <circle cx="370" cy="450" r="7" fill="url(#bubble-spec-192)" opacity="0.3" />

  <!-- Bubble Shield Aura surrounding the fish -->
  <circle cx="250" cy="262" r="156" fill="url(#shield-grad-192)" filter="url(#glow-192)" />
  <ellipse cx="230" cy="150" rx="35" ry="12" fill="#ffffff" opacity="0.35" transform="rotate(-15 230 150)" />

  <!-- Fish Group with Subtle Forward Tilt -->
  <g transform="translate(15, -4)">
    <!-- Caudal / Tail Fin -->
    <path d="M 175 265 Q 120 205 95 195 Q 115 255 125 268 Q 110 285 85 335 Q 125 320 175 272 Z"
          fill="url(#fin-grad-192)" />
    <!-- Dorsal Fin (Top) -->
    <path d="M 230 205 Q 260 145 315 160 Q 285 190 270 212 Z"
          fill="url(#fin-grad-192)" />
    <!-- Ventral Fin (Bottom) -->
    <path d="M 245 320 Q 265 365 295 360 Q 280 340 275 320 Z"
          fill="url(#fin-grad-192)" />

    <!-- Main Fish Body (Streamlined Oval/Teardrop) -->
    <path d="M 350 262 C 345 205 280 198 215 215 C 165 230 150 265 170 270 C 190 275 220 325 285 322 C 345 318 355 280 350 262 Z"
          fill="url(#fish-body-192)" filter="url(#glow-192)" />

    <!-- Belly Highlight Curve -->
    <path d="M 210 280 C 235 315 280 318 325 290 C 285 310 235 305 210 280 Z"
          fill="url(#fish-belly-192)" />

    <!-- Bioluminescent Flank Spots -->
    <circle cx="230" cy="255" r="4.5" fill="#ecfeff" opacity="0.9" />
    <circle cx="250" cy="258" r="5" fill="#ecfeff" opacity="0.95" />
    <circle cx="272" cy="262" r="5.5" fill="#ecfeff" opacity="0.95" />
    <circle cx="295" cy="265" r="5" fill="#ecfeff" opacity="0.9" />

    <!-- Pectoral Fin (Side Wing) -->
    <path d="M 255 268 Q 220 290 215 320 Q 240 305 265 280 Z"
          fill="url(#fin-grad-192)" stroke="#67e8f9" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Fish Eye: Outer White, Inner Navy, Catchlight -->
    <circle cx="318" cy="242" r="16" fill="#ffffff" />
    <circle cx="320" cy="242" r="10.5" fill="#0c4a6e" />
    <circle cx="321" cy="242" r="6" fill="#020617" />
    <circle cx="315" cy="237" r="4.5" fill="#ffffff" />
    <circle cx="323" cy="245" r="1.5" fill="#ffffff" />

    <!-- Cute Smiling Mouth -->
    <path d="M 346 268 Q 338 274 330 271" fill="none" stroke="#0369a1" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Foreground Bright Bubbles Floating from Mouth -->
  <g>
    <circle cx="375" cy="210" r="16" fill="url(#bubble-spec-192)" stroke="#a5f3fc" stroke-width="1.5" stroke-opacity="0.7" />
    <ellipse cx="371" cy="204" rx="4" ry="2.5" fill="#ffffff" opacity="0.9" transform="rotate(-20 371 204)" />

    <circle cx="405" cy="170" r="11" fill="url(#bubble-spec-192)" stroke="#a5f3fc" stroke-width="1" stroke-opacity="0.6" />
    <ellipse cx="402" cy="166" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.9" />

    <circle cx="420" cy="130" r="7" fill="url(#bubble-spec-192)" stroke="#a5f3fc" stroke-width="0.8" stroke-opacity="0.5" />
  </g>

  <!-- Inner Icon Border Glow -->
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.3" />
</svg>
