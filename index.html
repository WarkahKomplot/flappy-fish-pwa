<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0369a1" />
    <meta name="description" content="Underwater Flappy Bird clone with bioluminescent fish, fluid physics, and bubble shields" />

    <!-- iOS Safari PWA Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlappyFish" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="./manifest.json" />

    <title>Flappy Fish - Deep Sea Arcade</title>

    <!-- PWA Offline Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.warn('Flappy Fish SW registration failed:', err);
          });
        });
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
